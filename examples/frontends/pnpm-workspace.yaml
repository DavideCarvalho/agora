# Standalone example, intentionally NOT part of the agora Next.js site's pnpm
# workspace — its own dependency tree and lockfile.

allowBuilds:
  # sass (the Bootstrap kit) pulls @parcel/watcher's optional native build for `sass --watch`.
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: true
  '@swc/core': true
  # Install-time telemetry: OpenUI's lang-core postinstall pings PostHog, @scarf/scarf (a
  # CopilotKit dependency) reports installs. Neither is needed to build or run.
  '@openuidev/lang-core': false
  '@scarf/scarf': false
minimumReleaseAgeExclude:
  - '@adonis-agora/agent@0.72.0 || 0.74.0 || 0.74.1 || 0.75.0 || 0.76.1 || 0.76.2 || 0.76.3 || 0.79.0'
  - '@ai-sdk/gateway@4.0.108'
  - '@ai-sdk/mcp@2.0.71'
  - '@ai-sdk/openai@4.0.89'
  - '@ai-sdk/provider-utils@5.0.57'
  - '@ai-sdk/provider@4.0.25'
  - '@ai-sdk/react@4.0.136'
  - '@copilotkit/a2ui-renderer@1.77.1'
  - '@copilotkit/core@1.77.1'
  - '@copilotkit/mcp-apps-renderer@1.77.1'
  - '@copilotkit/react-core@1.77.1'
  - '@copilotkit/runtime-client-gql@1.77.1'
  - '@copilotkit/shared@1.77.1'
  - '@copilotkit/web-components@1.77.1'
  - '@copilotkit/web-inspector@1.77.1'
  - ai@7.0.133
  - playwright-core@1.64.0
  - playwright@1.64.0
# One @ag-ui/client and one rxjs for the CopilotKit page. Since 1.89, CopilotKit's core, shared and
# a2ui-renderer depend on zod 3 while react-core takes this app's zod 4 as a peer, so pnpm installed
# @ag-ui/client twice (one per zod): the agent `useAgent` returns and the one `runAgent` takes, and
# the `HttpAgent` the page subclasses and the one `CopilotKitProvider` takes, were different classes.
# CopilotKit supports zod 4 (react-core's peer is `zod >=3.25`; shared converts schemas through
# Standard JSON Schema), so its packages get the app's zod. @ag-ui/client pins rxjs 7.8.1 and the
# app uses 7.8.2 (the page builds an rxjs Observable for `HttpAgent.connect`): one rxjs, the app's.
overrides:
  '@copilotkit/core>zod': 4.6.7
  '@copilotkit/shared>zod': 4.6.7
  '@copilotkit/a2ui-renderer>zod': 4.6.7
  rxjs: 7.8.2
