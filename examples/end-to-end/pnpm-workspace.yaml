# This app is a standalone example, intentionally NOT part of the agora
# Next.js site's pnpm workspace — it has its own dependency tree and lockfile
# so installing/upgrading it can never affect the docs site's build.

allowBuilds:
  better-sqlite3: true
  esbuild: true
  '@swc/core': true
minimumReleaseAgeExclude:
  - '@adonis-agora/authkit-client@1.1.1'
  - '@adonis-agora/authkit-core@1.0.1'
  - '@adonis-agora/authkit-server@1.1.0'
  - '@adonis-agora/authz@1.0.0'
  - '@adonis-agora/context@1.0.0'
  - '@adonis-agora/filter-client@1.0.0'
  - '@adonis-agora/filter@1.0.0'
  - '@adonis-agora/media@1.1.1'
  - '@adonis-agora/telescope-ui@3.0.0'
  - '@adonis-agora/telescope@1.1.1'
